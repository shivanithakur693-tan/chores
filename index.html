<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ghar Ka Kaam</title>

<!-- PWA hookups -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4A90D9" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ SCREEN 1: START ============
       One giant tappable play button, full screen, no text needed.
       Tapping it is also the required "user gesture" that unlocks
       audio / speechSynthesis on Android Chrome. -->
  <div id="start-screen" class="screen active">
    <button id="start-btn" aria-label="Start">
      <img src="images/start.svg" alt="" draggable="false" />
    </button>
  </div>

  <!-- ============ SCREEN 2: TASK CARD ============ -->
  <div id="task-screen" class="screen">
    <div id="progress-dots" class="progress-dots"></div>

    <div class="task-image-wrap">
      <img id="task-image" src="" alt="" draggable="false" />
    </div>

    <div class="answer-buttons">
      <button id="btn-no" class="answer-btn no-btn" aria-label="No / Not done">
        <img src="images/cross.svg" alt="" draggable="false" />
      </button>
      <button id="btn-yes" class="answer-btn yes-btn" aria-label="Yes / Done">
        <img src="images/checkmark.svg" alt="" draggable="false" />
      </button>
    </div>
  </div>

  <!-- ============ SCREEN 3: SUMMARY ============ -->
  <div id="summary-screen" class="screen">
    <div id="summary-grid" class="summary-grid"></div>
    <div class="tap-anywhere-hint" aria-hidden="true"></div>
  </div>

  <script src="js/tasks-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
